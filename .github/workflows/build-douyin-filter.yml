name: Internal Douyin Filter Stability Build

on:
  push:
    branches: [ internal-v0.7.6-stability ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-v0.7.6-stability
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen recognition rules and internal stability changes
        shell: bash
        run: |
          set -euo pipefail
          CTRL='app/src/main/java/com/example/tapreplay/AutomationController.java'
          MODEL='app/src/main/java/com/example/tapreplay/ModelEngine.java'
          CAP='app/src/main/java/com/example/tapreplay/ScreenCaptureService.java'
          DIAG='app/src/main/java/com/example/tapreplay/StabilityDiagnostics.java'
          FLOW7='app/src/main/java/com/example/tapreplay/ShareFlowV7.java'
          FLOW8='app/src/main/java/com/example/tapreplay/ShareFlowV8.java'

          # Recognition/sampling baseline stays frozen.
          grep -q 'TARGET_FRAMES = 18' "$CTRL"
          grep -q 'MAX_FRAMES = 20' "$CTRL"
          grep -q 'SAMPLE_INTERVAL_MS = 300' "$CTRL"
          grep -q 'MAX_CAPTURE_MS = 8000' "$CTRL"
          grep -q 'AFTER_SWIPE_MS = 950' "$CTRL"
          grep -q 'SIGLIP_PIPELINE_BATCH = 9' "$CTRL"
          grep -q 'FEMALE_MIN_PROB = 0.40f' "$MODEL"
          grep -q 'FEMALE_MIN_MARGIN = 0.04f' "$MODEL"
          grep -q 'FEMALE_RATIO_PERSON = 0.60f' "$MODEL"
          grep -q 'FEMALE_RATIO_ALL = 0.50f' "$MODEL"
          grep -q 'POS_A_TOPK = 0.68f' "$MODEL"
          grep -q 'POS_A_MAX = 0.75f' "$MODEL"
          grep -q 'POS_B_TOPK = 0.60f' "$MODEL"
          grep -q 'POS_C_TOPK = 0.54f' "$MODEL"
          grep -q 'POS_D_TOPK = 0.55f' "$MODEL"
          grep -q 'BORDER_TOPK = 0.46f' "$MODEL"
          grep -q 'SENSUAL_INDEX = 4' "$MODEL"

          # Share safety remains V8 wrapper + V7 one-send core.
          grep -q 'ShareFlowV8.shareToTarget' "$CTRL"
          grep -q 'ShareFlowV7.shareToTarget(service, target, running)' "$FLOW8"
          grep -q 'disableV7CoordinateCache' "$FLOW8"
          ! grep -q 'swipeNextVideo' "$FLOW8"
          grep -q 'waitForTargetAccepted' "$FLOW7"
          grep -q 'detectActiveSendButtonByPixels' "$FLOW7"
          # Freeze the proven released v0.7.5 sharing path byte-for-byte.
          test "$(git hash-object "$FLOW7")" = "b6d62a28ef94ad83115f2a41f114bd3f978ce1aa"
          test "$(git hash-object "$FLOW8")" = "e6ace869b400ac771bf7dbaf6e7426e46ed9387a"
          test "$(git hash-object app/src/main/java/com/example/tapreplay/TapAccessibilityService.java)" = "5e4ff717db6a422a84c1bf6d2b65ab611c0462be"

          # Internal stability changes.
          grep -q 'CLIP_INFER_BATCH = 12' "$MODEL"
          grep -q 'ORT_INTRA_OP_THREADS_MAX = 4' "$MODEL"
          grep -q 'ensureSiglipInputBuffer' "$MODEL"
          grep -q 'ensureClipInputBuffer' "$MODEL"
          grep -q 'MEMBUF' "$MODEL"
          grep -q 'CAPTURE_REAUTHORIZE_AFTER_MISSES = 5' "$CTRL"
          grep -q 'invalidateForReauthorization' "$CTRL"
          grep -q 'invalidateForReauthorization' "$CAP"
          grep -q 'ignored stale MediaProjection onStop' "$CAP"
          grep -q 'getHistoricalProcessExitReasons' "$DIAG"
          grep -q 'getNativeHeapAllocatedSize' "$DIAG"
          grep -q 'getCurrentThermalStatus' "$DIAG"

          grep -q "versionName '0.7.6-internal.3'" app/build.gradle
          grep -q 'versionCode 15' app/build.gradle
          echo 'Internal stability invariants passed.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-douyin-filter-v2

      - name: Install model export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow transformers==4.50.0 huggingface_hub onnx==1.17.0 onnxruntime==1.29.0

      - name: Export FP16 ONNX models
        run: |
          mkdir -p app/src/main/assets/models
          python tools/export_models.py app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Verify CLIP batch splitting is numerically equivalent
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort

          path = 'app/src/main/assets/models/clip_female_vision_fp16.onnx'
          sess = ort.InferenceSession(path, providers=['CPUExecutionProvider'])
          name = sess.get_inputs()[0].name
          rng = np.random.default_rng(312)
          x = rng.uniform(-1.0, 1.0, size=(13, 3, 224, 224)).astype(np.float16)

          full = sess.run(None, {name: x})[0]
          chunked = np.concatenate([
              sess.run(None, {name: x[:12]})[0],
              sess.run(None, {name: x[12:]})[0],
          ], axis=0)

          diff = float(np.max(np.abs(full.astype(np.float32) - chunked.astype(np.float32))))
          print('CLIP full-vs-12+1 max_abs_diff =', diff)
          if not np.allclose(full, chunked, rtol=1e-3, atol=1e-3):
              raise SystemExit('CLIP chunked batch numerical equivalence check failed')
          PY

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare internal APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DouyinFilter-v0.7.6-internal3.apk
          sha256sum DouyinFilter-v0.7.6-internal3.apk
          ls -lh DouyinFilter-v0.7.6-internal3.apk

      - name: Upload internal APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: DouyinFilter-v0.7.6-internal3-debug-apk
          path: DouyinFilter-v0.7.6-internal3.apk
          compression-level: 0
          retention-days: 14
