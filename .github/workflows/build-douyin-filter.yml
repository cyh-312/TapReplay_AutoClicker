name: Build Douyin Filter APK

on:
  push:
    branches: [ douyin-filter-android ]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: douyin-filter-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v0.7.3 quality and stability invariants
        shell: bash
        run: |
          set -euo pipefail
          FLOW='app/src/main/java/com/example/tapreplay/ShareFlowV7.java'
          CTRL='app/src/main/java/com/example/tapreplay/AutomationController.java'
          MODEL='app/src/main/java/com/example/tapreplay/ModelEngine.java'
          UI='app/src/main/java/com/example/tapreplay/TapAccessibilityService.java'
          LOG='app/src/main/java/com/example/tapreplay/TraceLogger.java'

          # Frozen sampling/model quality rules.
          grep -q 'TARGET_FRAMES = 18' "$CTRL"
          grep -q 'MAX_FRAMES = 20' "$CTRL"
          grep -q 'SAMPLE_INTERVAL_MS = 300' "$CTRL"
          grep -q 'MAX_CAPTURE_MS = 8000' "$CTRL"
          grep -q 'AFTER_SWIPE_MS = 950' "$CTRL"
          grep -q 'FEMALE_MIN_PROB = 0.40f' "$MODEL"
          grep -q 'POS_A_TOPK = 0.68f' "$MODEL"
          grep -q 'POS_A_MAX = 0.75f' "$MODEL"
          grep -q 'POS_B_TOPK = 0.60f' "$MODEL"
          grep -q 'POS_C_TOPK = 0.54f' "$MODEL"
          grep -q 'POS_D_TOPK = 0.55f' "$MODEL"
          grep -q 'BORDER_TOPK = 0.46f' "$MODEL"
          grep -q 'SENSUAL_INDEX = 4' "$MODEL"

          # Pipeline only changes scheduling: two 9-frame SigLIP batches, same final CLIP/rules.
          grep -q 'SIGLIP_PIPELINE_BATCH = 9' "$CTRL"
          grep -q 'engine.scoreSiglip(batch)' "$CTRL"
          grep -q 'engine.analyzeWithSensual(frames, siglip.scores)' "$CTRL"
          grep -q 'pipeline fallback to full analyze' "$CTRL"
          grep -q 'siglipTailWaitMs=' "$CTRL"
          grep -q 'public float\[\] scoreSiglip' "$MODEL"
          grep -q 'public Decision analyzeWithSensual' "$MODEL"

          # Share remains parameter-driven, exact-target and single-send, with the new settle/ack gate.
          grep -q 'ShareFlowV7.shareToTarget' "$CTRL"
          ! grep -q 'swipeContactRow' "$FLOW"
          ! grep -q 'FORWARD_PAGES' "$FLOW"
          ! grep -q 'RESET_SWIPES' "$FLOW"
          grep -q 'findAccessibilityNodeInfosByText("分享")' "$FLOW"
          grep -q 'PANEL_MIN_SETTLE_MS = 250L' "$FLOW"
          grep -q 'TARGET_ACK_TIMEOUT_MS = 500L' "$FLOW"
          grep -q 'TYPE_VIEW_CLICKED' "$FLOW"
          grep -q 'waitForTargetAccepted' "$FLOW"
          grep -q 'detectActiveSendButtonByPixels' "$FLOW"
          grep -q 'main.MainActivity' "$FLOW"
          grep -q 'ShareFlowV7.onAccessibilityEvent' "$UI"
          grep -q 'TYPE_WINDOW_CONTENT_CHANGED) return' "$UI"
          grep -q 'status.setMaxLines(2)' "$UI"

          # Log/storage limits remain fixed.
          grep -q 'MAX_FILE_BYTES = 1024L \* 1024L' "$LOG"
          grep -q 'MAX_BACKUPS = 4' "$LOG"
          grep -q "versionName '0.7.3'" app/build.gradle
          grep -q 'versionCode 10' app/build.gradle
          echo 'v0.7.3 static quality/stability checks passed.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-douyin-filter-v2

      - name: Install model export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow transformers==4.50.0 huggingface_hub onnx==1.17.0 onnxruntime==1.29.0

      - name: Export corrected FP16 ONNX models
        run: |
          mkdir -p app/src/main/assets/models
          python tools/export_models.py app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DouyinFilter-v0.7.3.apk
          ls -lh DouyinFilter-v0.7.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinFilter-v0.7.3-debug-apk
          path: DouyinFilter-v0.7.3.apk
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: douyin-filter-v0.7.3
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DouyinFilter-v0.7.3.apk --clobber
          else
            gh release create "$TAG" DouyinFilter-v0.7.3.apk \
              --target "$GITHUB_SHA" \
              --title "DouyinFilter Android V0.7.3" \
              --notes "V0.7.3 在不改变识别质量参数的前提下做两项修复优化。分析侧保留18帧、300ms采样、SigLIP2/CLIP、女性Gate、A/B/C/D及全部阈值不变，将SigLIP2改为两批9帧流水线：前9帧采完即在单独推理线程运行，主线程继续采后9帧，最终仍按完整18帧分数选择原有CLIP检查帧并执行原规则；失败时自动回退旧的完整分析路径。新增PERF日志记录captureMs、siglipComputeMs、siglipTailWaitMs、clipDecisionMs和postCaptureMs用于实机评估。分享侧针对日志确认的偶发联系人点空：SharePanelDialog出现后仅在过快时补足250ms最小稳定年龄，点击精确联系人后必须收到抖音真实VIEW_CLICKED或选中后的FrameLayout窗口状态，才允许检测并点击红色发送按钮；仍不重复点联系人、不横滑联系人、不重复发送，发送后继续以MainActivity事件快速确认返回。日志上限仍约5MiB。"
          fi
