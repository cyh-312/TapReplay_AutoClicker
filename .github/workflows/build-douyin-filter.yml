name: Internal Douyin Filter Clean Stability Build

on:
  push:
    branches: [ internal-v0.7.6-clean ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-v0.7.6-clean
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify released V0.7.5 behavior is frozen
        shell: bash
        run: |
          set -euo pipefail
          FLOW7='app/src/main/java/com/example/tapreplay/ShareFlowV7.java'
          FLOW8='app/src/main/java/com/example/tapreplay/ShareFlowV8.java'
          UI='app/src/main/java/com/example/tapreplay/TapAccessibilityService.java'
          CAP='app/src/main/java/com/example/tapreplay/ScreenCaptureService.java'
          LOG='app/src/main/java/com/example/tapreplay/TraceLogger.java'
          CTRL='app/src/main/java/com/example/tapreplay/AutomationController.java'
          MODEL='app/src/main/java/com/example/tapreplay/ModelEngine.java'
          MANIFEST='app/src/main/AndroidManifest.xml'
          A11Y='app/src/main/res/xml/accessibility_service_config.xml'
          EXPORT='tools/export_models.py'

          # Byte-for-byte freeze of the already proven interaction path from released V0.7.5.
          test "$(git hash-object "$FLOW7")" = "b6d62a28ef94ad83115f2a41f114bd3f978ce1aa"
          test "$(git hash-object "$FLOW8")" = "e6ace869b400ac771bf7dbaf6e7426e46ed9387a"
          test "$(git hash-object "$UI")" = "5e4ff717db6a422a84c1bf6d2b65ab611c0462be"
          test "$(git hash-object "$CAP")" = "6c66fad24f798d74ab1e941b817e07f7633908a7"
          test "$(git hash-object "$LOG")" = "278d56abea69d1c5775cc774ccde810a9cfae248"
          test "$(git hash-object "$MANIFEST")" = "f5b35b7479b5e78e729274cf0c91abdf731872d8"
          test "$(git hash-object "$A11Y")" = "0bbd127f960deb68ce04974b80983fcce32e2216"
          test "$(git hash-object "$EXPORT")" = "8b4834d86eb78cd72199954594a56741b85fa8ac"

          # Sampling, timing, share entry point and recognition decisions stay exactly at V0.7.5 values.
          grep -q 'TARGET_FRAMES = 18' "$CTRL"
          grep -q 'MAX_FRAMES = 20' "$CTRL"
          grep -q 'SAMPLE_INTERVAL_MS = 300' "$CTRL"
          grep -q 'MAX_CAPTURE_MS = 8000' "$CTRL"
          grep -q 'AFTER_SWIPE_MS = 950' "$CTRL"
          grep -q 'BETWEEN_CYCLES_MS = 350' "$CTRL"
          grep -q 'SIGLIP_PIPELINE_BATCH = 9' "$CTRL"
          grep -q 'ShareFlowV8.shareToTarget' "$CTRL"

          grep -q 'FEMALE_MIN_PROB = 0.40f' "$MODEL"
          grep -q 'FEMALE_MIN_MARGIN = 0.04f' "$MODEL"
          grep -q 'FEMALE_RATIO_PERSON = 0.60f' "$MODEL"
          grep -q 'FEMALE_RATIO_ALL = 0.50f' "$MODEL"
          grep -q 'POS_A_TOPK = 0.68f' "$MODEL"
          grep -q 'POS_A_MAX = 0.75f' "$MODEL"
          grep -q 'POS_B_TOPK = 0.60f' "$MODEL"
          grep -q 'POS_C_TOPK = 0.54f' "$MODEL"
          grep -q 'POS_D_TOPK = 0.55f' "$MODEL"
          grep -q 'BORDER_TOPK = 0.46f' "$MODEL"
          grep -q 'SENSUAL_INDEX = 4' "$MODEL"

          # Keep released CPU threading; stability changes are limited to allocation/cleanup.
          grep -q 'opts.setIntraOpNumThreads(Math.max(2, Math.min(6, cores - 2)))' "$MODEL"
          grep -q 'opts.setInterOpNumThreads(1)' "$MODEL"

          # Allowed stability-only changes.
          grep -q 'CLIP_INFER_BATCH = 12' "$MODEL"
          grep -q 'ensureSiglipInputBuffer' "$MODEL"
          grep -q 'ensureClipInputBuffer' "$MODEL"
          grep -q 'StabilityDiagnostics.logStartupExitInfo' "$CTRL"
          grep -q 'StabilityDiagnostics.logSnapshot' "$CTRL"
          grep -q "versionName '0.7.6-internal.4'" app/build.gradle
          grep -q 'versionCode 16' app/build.gradle
          grep -q "onnxruntime-android:1.29.0" app/build.gradle

          echo 'Released V0.7.5 working behavior is frozen; only stability changes are present.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-douyin-filter-v2

      - name: Install model export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow transformers==4.50.0 huggingface_hub onnx==1.17.0 onnxruntime==1.29.0

      - name: Export the same FP16 ONNX models as V0.7.5
        run: |
          mkdir -p app/src/main/assets/models
          python tools/export_models.py app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Verify CLIP chunking preserves model output
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort

          path = 'app/src/main/assets/models/clip_female_vision_fp16.onnx'
          sess = ort.InferenceSession(path, providers=['CPUExecutionProvider'])
          name = sess.get_inputs()[0].name
          rng = np.random.default_rng(312)
          x = rng.uniform(-1.0, 1.0, size=(25, 3, 224, 224)).astype(np.float16)

          full = sess.run(None, {name: x})[0]
          chunked = np.concatenate([
              sess.run(None, {name: x[0:12]})[0],
              sess.run(None, {name: x[12:24]})[0],
              sess.run(None, {name: x[24:25]})[0],
          ], axis=0)

          diff = float(np.max(np.abs(full.astype(np.float32) - chunked.astype(np.float32))))
          print('CLIP full-vs-12-batch max_abs_diff =', diff)
          if not np.allclose(full, chunked, rtol=1e-3, atol=1e-3):
              raise SystemExit('CLIP chunked batch numerical equivalence check failed')
          PY

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare internal APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DouyinFilter-v0.7.6-internal4.apk
          sha256sum DouyinFilter-v0.7.6-internal4.apk
          ls -lh DouyinFilter-v0.7.6-internal4.apk

      - name: Upload internal APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: DouyinFilter-v0.7.6-internal4-clean-debug-apk
          path: DouyinFilter-v0.7.6-internal4.apk
          compression-level: 0
          retention-days: 14
