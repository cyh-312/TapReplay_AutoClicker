name: Build Douyin Filter APK

on:
  push:
    branches: [ douyin-filter-android ]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: douyin-filter-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v0.7 share safety invariants
        shell: bash
        run: |
          set -euo pipefail
          FLOW='app/src/main/java/com/example/tapreplay/ShareFlowV5.java'
          CTRL='app/src/main/java/com/example/tapreplay/AutomationController.java'
          UI='app/src/main/java/com/example/tapreplay/TapAccessibilityService.java'

          grep -q 'ShareFlowV5.shareToTarget' "$CTRL"
          ! grep -q 'ShareFlowV4.shareToTarget' "$CTRL"
          ! grep -q 'swipeContactRow' "$FLOW"
          ! grep -q 'FORWARD_PAGES' "$FLOW"
          ! grep -q 'RESET_SWIPES' "$FLOW"
          grep -q '只扫描当前可见联系人' "$FLOW"
          grep -q 'detectActiveSendButtonByPixels' "$FLOW"
          grep -q 'status.setMaxLines(2)' "$UI"
          grep -q "versionName '0.7.0'" app/build.gradle
          echo 'v0.7 static safety checks passed.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-douyin-filter-v2

      - name: Install model export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow transformers==4.50.0 huggingface_hub onnx==1.17.0 onnxruntime==1.29.0

      - name: Export corrected FP16 ONNX models
        run: |
          mkdir -p app/src/main/assets/models
          python tools/export_models.py app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DouyinFilter-v0.7.apk
          ls -lh DouyinFilter-v0.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinFilter-v0.7-debug-apk
          path: DouyinFilter-v0.7.apk
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: douyin-filter-v0.7.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DouyinFilter-v0.7.apk --clobber
          else
            gh release create "$TAG" DouyinFilter-v0.7.apk \
              --target "$GITHUB_SHA" \
              --title "DouyinFilter Android V0.7" \
              --notes "V0.7 稳定优先版：分享前清理上一次残留面板；只认右侧高可信分享按钮；必须精确确认“分享给”；联系人只扫描当前可见区域，彻底取消自动横滑；目标只允许精确匹配且最多点击一次；发送只认内存截图中已经亮起的大面积抖音红色按钮，不用灰色发送节点推断选中状态；发送只点一次，失败保留现场；悬浮日志固定两行显示①~⑥阶段和耗时。SigLIP2 + CLIP 模型、采样、女性门控、A/B/C/D 和阈值全部不变。"
          fi
