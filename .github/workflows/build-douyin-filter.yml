name: Build Douyin Filter APK

on:
  push:
    branches: [ douyin-filter-android ]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: douyin-filter-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-douyin-filter-v2

      - name: Install model export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow transformers==4.50.0 huggingface_hub onnx==1.17.0 onnxruntime==1.29.0

      - name: Export corrected FP16 ONNX models
        run: |
          mkdir -p app/src/main/assets/models
          python tools/export_models.py app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DouyinFilter-v0.6.apk
          ls -lh DouyinFilter-v0.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinFilter-v0.6-debug-apk
          path: DouyinFilter-v0.6.apk
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: douyin-filter-v0.6.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DouyinFilter-v0.6.apk --clobber
          else
            gh release create "$TAG" DouyinFilter-v0.6.apk \
              --target "$GITHUB_SHA" \
              --title "DouyinFilter Android V0.6" \
              --notes "V0.6：重点修复分享慢、日志无法定位、联系人被自动横滑后消失的问题。分享日志拆成①找分享、②认分享栏、③找联系人、④点联系人、⑤找发送、⑥发送，并显示当前次数/候选数/耗时；联系人会先原地连续扫描并尝试复位到常用联系人起点，确认没有目标后才有限翻页；昵称匹配区域扩大到整个分享联系人安全区域；发送按钮已亮时不再重复点联系人；失败时保留最后阶段日志。SigLIP2 + CLIP 模型、阈值和视频判断规则不变。"
          fi
